[project]
name = "reconflow"
version = "0.2.0"
description = "Recon pipeline for bug bounty hunters with differential change tracking"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Nithishvelan M", email = "mnithishvelan@gmail.com" }
]
keywords = [
    "bugbounty",
    "recon",
    "reconnaissance",
    "subdomain",
    "subfinder",
    "httpx",
    "differential",
    "security",
    "infosec",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/ErenYeager1836/reconflow"
Repository = "https://github.com/ErenYeager1836/reconflow"
Issues = "https://github.com/ErenYeager1836/reconflow/issues"

[project.scripts]
reconflow = "reconflow.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reconflow", "reconflow.wordlists"]

[tool.setuptools.package-data]
"reconflow.wordlists" = ["*.txt"]
